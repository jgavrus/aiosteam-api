

[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools >= 64.0.0']

[project]
authors = [{email = 'jeygavrus@gmail.com', name = 'Yevhenii Havrus'}]
classifiers = [
  'Development Status :: 4 - Beta',
  'Framework :: AsyncIO',
  'Intended Audience :: Developers',
  'License :: OSI Approved :: MIT License',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
]
dependencies = ['aiohttp', 'beautifulsoup4', 'pydantic>=2']
description = 'Async Python Client wrapper for Steam API'
dynamic = ['version']
keywords = ['api', 'async', 'async steam', 'async steam community', 'steam api']
license = {file = 'LICENCE'}
name = 'aiosteam-api'
readme = 'README.md'
requires-python = '>=3.10'

[project.optional-dependencies]
build = ['build', 'twine']
style = ['ruff>=0.1.8']
# aioresponses 0.7.9 does not support aiohttp 3.14+ (ClientResponse gained a required
# stream_writer argument), so the test extra caps it. The library itself works on 3.14.
test = ['aiohttp<3.14', 'aioresponses', 'pytest', 'pytest-asyncio']

[project.urls]
source = 'https://github.com/jgavrus/aiosteam-api'
tracker = 'https://github.com/jgavrus/aiosteam-api/issues'

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']

[tool.ruff]
line-length = 120
target-version = 'py310'

[tool.ruff.lint]
select = ['A', 'B', 'E', 'F', 'UP', 'W']

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401']

[tool.setuptools.dynamic]
version = {attr = 'aiosteam_api._version.__version__'}

[tool.setuptools.packages.find]
include = ['aiosteam_api*']
